
name: .NET Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build .NET Solution
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: TheCSharpPlayersGuide

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore TheCSharpPlayersGuide.slnx

      - name: Build solution
        run: dotnet build TheCSharpPlayersGuide.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test TheCSharpPlayersGuide.slnx --configuration Release --no-build
